# Stages this package on npm on every version tag push (e.g. 1.0.2).
#
# n8n only verifies community nodes published from GitHub Actions with an npm
# provenance statement. This workflow builds the package here and uploads it
# with `npm stage publish --provenance`, so the version waits in npm's stage
# queue until a maintainer approves it with 2FA:
#
#   - npmjs.com: the package's "Staged Packages" tab, or
#   - CLI: `npm stage list n8n-nodes-pinglet`, then `npm stage approve <stage-id>`
#
# Auth is npm Trusted Publishing (OIDC), configured on npmjs.com for
# TheGlenn88/n8n-nodes-pinglet, workflow publish.yml, with only "npm stage
# publish" allowed. No npm token is stored in the repo.
#
# To release: bump the version, tag it without a "v" prefix, push the tag:
#
#   npm version patch --tag-version-prefix="" && git push --follow-tags

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token for trusted publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # `npm stage publish` needs npm 11.15.0 or later; don't rely on the
      # version bundled with the runner's Node.
      - name: Update npm
        run: npm install -g npm@^12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Stage for approval
        # RELEASE_MODE satisfies the n8n-node prerelease guard on prepublishOnly.
        run: npm stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
